{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">(GS)</div>
      <h1>Welcome Back</h1>
      <p>Login to your GharSeva account</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form" id="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="form-group">
        <label for="phone">Phone Number or Email</label>
        <div class="input-wrapper">
          <input type="text" id="phone" name="phone" required autocomplete="username" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-submit-btn">Login</button>
    </form>

    <div class="auth-divider"><span>Don't have an account?</span></div>

    <div class="auth-links">
      <a href="{{ url_for('auth.register_customer') }}" class="btn btn-outline btn-full" id="goto-register-customer">
        Register as Customer
      </a>
      <a href="{{ url_for('auth.register_worker') }}" class="btn btn-ghost btn-full" id="goto-register-worker">
        Register as Worker
      </a>
    </div>
  </div>
</div>
{% endblock %}
