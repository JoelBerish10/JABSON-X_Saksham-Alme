{% extends "base.html" %}
{% block title %}Register as Customer{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card auth-card-wide">
    <div class="auth-header">
      <div class="auth-logo">(GS)</div>
      <h1>Register as Customer</h1>
      <p>Find trusted local workers for your household needs</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register_customer') }}" class="auth-form" id="register-customer-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="form-row">
        <div class="form-group">
          <label for="full_name">Full Name <span class="req">*</span></label>
          <div class="input-wrapper">
            <input type="text" id="full_name" name="full_name" required placeholder="Your full name"
                   value="{{ form_data.get('full_name', '') }}" autocomplete="name" />
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number <span class="req">*</span></label>
          <div class="input-wrapper">
            <input type="tel" id="phone" name="phone" required placeholder="10-digit mobile number"
                   value="{{ form_data.get('phone', '') }}" autocomplete="tel" />
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email <span class="optional">(optional)</span></label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" placeholder="your@email.com"
                 value="{{ form_data.get('email', '') }}" autocomplete="email" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password <span class="req">*</span></label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" required
                   placeholder="Min 8 characters" autocomplete="new-password" />
            <button type="button" class="toggle-password" onclick="togglePassword('password')" aria-label="Show password">Show</button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password <span class="req">*</span></label>
          <div class="input-wrapper">
            <input type="password" id="confirm_password" name="confirm_password" required
                   placeholder="Repeat password" autocomplete="new-password" />
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="preferred_language">Preferred Language</label>
        <div class="input-wrapper">
          <select id="preferred_language" name="preferred_language">
            <option value="en" {% if form_data.get('preferred_language','en') == 'en' %}selected{% endif %}>English</option>
            <option value="hi" {% if form_data.get('preferred_language') == 'hi' %}selected{% endif %}>हिन्दी</option>
            <option value="kn" {% if form_data.get('preferred_language') == 'kn' %}selected{% endif %}>ಕನ್ನಡ</option>
            <option value="ta" {% if form_data.get('preferred_language') == 'ta' %}selected{% endif %}>தமிழ்</option>
            <option value="te" {% if form_data.get('preferred_language') == 'te' %}selected{% endif %}>తెలుగు</option>
            <option value="mr" {% if form_data.get('preferred_language') == 'mr' %}selected{% endif %}>मराठी</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="register-customer-submit">
        Create Customer Account →
      </button>
    </form>

    <div class="auth-divider"><span>Already have an account?</span></div>
    <a href="{{ url_for('auth.login') }}" class="btn btn-ghost btn-full" id="goto-login-from-customer">Login</a>
    <p class="auth-switch">Want to offer services? <a href="{{ url_for('auth.register_worker') }}">Register as Worker</a></p>
  </div>
</div>
{% endblock %}
